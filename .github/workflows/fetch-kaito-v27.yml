name: Fetch Kaito V27 public output

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-kaito-v27.yml'

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install downloader
        run: python -m pip install -q kagglehub
      - name: Download notebook output
        shell: bash
        run: |
          mkdir -p out
          python - <<'PY'
          import kagglehub, shutil, os
          p=kagglehub.notebook_output_download('kaitofukami/25-27-strict-future-v27-midgame-meta-reset')
          print('downloaded',p)
          if os.path.isdir(p):
              for name in os.listdir(p):
                  src=os.path.join(p,name); dst=os.path.join('out',name)
                  if os.path.isdir(src): shutil.copytree(src,dst,dirs_exist_ok=True)
                  else: shutil.copy2(src,dst)
          else:
              shutil.copy2(p,'out/')
          PY
          find out -maxdepth 3 -type f -printf '%P\t%s\n' | sort | tee out/MANIFEST.txt
          find out -maxdepth 3 -type f -print0 | xargs -0 sha256sum > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: kaito-v27-public-output
          path: out/
          retention-days: 1

